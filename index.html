<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百家樂多維單分析與旗艦預測系統 (線上直播面板旗艦版)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2f;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --banker-color: #dc2626;
            --player-color: #2563eb;
            --tie-color: #16a34a;
            --border-color: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 10px;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        /* 預測看板樣式 */
        .prediction-box {
            text-align: center;
            padding: 20px 0;
        }
        .prediction-signal {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        .prediction-reason {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        /* 控制按鈕樣式 */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-banker { background-color: var(--banker-color); }
        .btn-player { background-color: var(--player-color); }
        .btn-tie { background-color: var(--tie-color); }
        
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .action-row .btn {
            flex: 1;
            background-color: #334155;
        }
        /* 路單與歷史紀錄區塊 */
        .roadmaps {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .road-container {
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .road-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .history-list {
            font-size: 0.85rem;
            color: var(--text-muted);
            max-height: 80px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>百家樂多維單分析與旗艦預測系統</h1>
            <p>線上直播面板旗艦版 - 嚴格多維共振與無邏輯觀望核心</p>
        </header>

        <div class="dashboard">
            <!-- 左側操作與預測區 -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="card">
                    <h2>即時預測訊號</h2>
                    <div class="prediction-box">
                        <div class="prediction-signal" id="prediction-signal">觀望</div>
                        <div class="prediction-reason" id="prediction-reason">局數不足，暫無邏輯</div>
                    </div>
                </div>

                <div class="card">
                    <h2>控制台 (輸入開牌結果)</h2>
                    <div class="controls">
                        <button class="btn btn-banker" onclick="addResult('B')">莊 (B)</button>
                        <button class="btn btn-player" onclick="addResult('P')">閒 (P)</button>
                        <button class="btn btn-tie" onclick="addResult('T')">和 (T)</button>
                    </div>
                    <div class="action-row">
                        <button class="btn" onclick="undoResult()">悔棋</button>
                        <button class="btn" onclick="resetGame()" style="background-color: #7f1d1d;">重置</button>
                    </div>
                </div>

                <div class="card">
                    <h2>歷史局勢紀錄</h2>
                    <div class="history-list" id="history-list-text">尚無紀錄</div>
                </div>
            </div>

            <!-- 右側多維路單與分析區 -->
            <div class="card roadmaps">
                <h2>多維路單與狀態檢視</h2>
                
                <div class="road-container">
                    <div class="road-title">大路結構摘要</div>
                    <div id="big-road-view" style="font-size: 0.9rem; color: var(--text-muted); padding: 5px 0;">等待數據輸入...</div>
                </div>

                <div class="road-container">
                    <div class="road-title">下三路動態指標 (大眼仔路 / 小路 / 曱甴路)</div>
                    <div id="lower-road-view" style="font-size: 0.9rem; color: var(--text-muted); padding: 5px 0;">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 紀錄歷史局勢數據 ('B', 'P', 'T')
        let gameHistory = [];

        function addResult(result) {
            gameHistory.push(result);
            updateDisplay();
        }

        function undoResult() {
            gameHistory.pop();
            updateDisplay();
        }

        function resetGame() {
            if (confirm("確定要重置所有紀錄嗎？")) {
                gameHistory = [];
                updateDisplay();
            }
        }

        // 核心：解析大路矩陣
        function parseBigRoad(history) {
            let bigRoad = [];
            let currentCol = [];
            let lastResult = '';
            
            history.forEach((result) => {
                if (result === 'T') {
                    if (bigRoad.length > 0) {
                        let lastCol = bigRoad[bigRoad.length - 1];
                        let lastItem = lastCol[lastCol.length - 1];
                        if (lastItem) lastItem.ties = (lastItem.ties || 0) + 1;
                    }
                    return;
                }

                if (result === lastResult || lastResult === '') {
                    currentCol.push(result);
                } else {
                    if (currentCol.length > 0) {
                        bigRoad.push(currentCol);
                    }
                    currentCol = [result];
                }
                lastResult = result;
            });
            if (currentCol.length > 0) {
                bigRoad.push(currentCol);
            }
            return bigRoad;
        }

        // 核心：下三路分析輔助函數
        function analyzeLowerRoad(bigRoad, offset) {
            if (bigRoad.length < offset + 1) return null;
            let hasPattern = checkRoadPattern(bigRoad, offset);
            if (!hasPattern) return null;
            return hasPattern; 
        }

        // 檢查特定規律是否存在
        function checkRoadPattern(bigRoad, offset) {
            let colCount = bigRoad.length;
            if (colCount <= offset) return null;

            let currentLen = bigRoad[colCount - 1].length;
            let compareLen = bigRoad[colCount - 1 - offset].length;

            if (currentLen === compareLen) {
                return bigRoad[colCount - 1][0]; 
            } else if (Math.abs(currentLen - compareLen) === 1) {
                return null; 
            }

            return null; 
        }

        // 主預測函數：多維分析與觀望機制
        function calculatePrediction() {
            if (gameHistory.length < 6) {
                return { signal: "觀望", reason: "局數不足，暫無邏輯" };
            }

            const bigRoad = parseBigRoad(gameHistory);
            
            const bigEyeBoy = analyzeLowerRoad(bigRoad, 1); // 大眼仔路
            const smallRoad = analyzeLowerRoad(bigRoad, 2); // 小路
            const cockroachRoad = analyzeLowerRoad(bigRoad, 3); // 曱甴路

            let signals = [];
            if (bigEyeBoy) signals.push(bigEyeBoy);
            if (smallRoad) signals.push(smallRoad);
            if (cockroachRoad) signals.push(cockroachRoad);

            // 核心修正：刪除連續趨勢判定，無邏輯則觀望
            if (signals.length === 0) {
                return { signal: "觀望", reason: "未出現明確路單邏輯" };
            }

            let firstSignal = signals[0];
            let isConsensus = signals.every(s => s === firstSignal);

            if (isConsensus && signals.length >= 2) {
                return { 
                    signal: firstSignal === 'B' ? "莊 (Banker)" : "閒 (Player)", 
                    reason: "多維下三路邏輯共振" 
                };
            }

            return { signal: "觀望", reason: "多維邏輯分歧，暫不進場" };
        }

        // 更新介面顯示
        function updateDisplay() {
            const prediction = calculatePrediction();
            
            const signalElement = document.getElementById("prediction-signal");
            const reasonElement = document.getElementById("prediction-reason");
            const historyText = document.getElementById("history-list-text");
            const bigRoadView = document.getElementById("big-road-view");
            const lowerRoadView = document.getElementById("lower-road-view");
            
            if (signalElement) {
                signalElement.innerText = prediction.signal;
                if (prediction.signal === "觀望") {
                    signalElement.style.color = "var(--text-muted)";
                } else {
                    signalElement.style.color = prediction.signal.includes("莊") ? "var(--banker-color)" : "var(--player-color)";
                }
            }
            
            if (reasonElement) {
                reasonElement.innerText = prediction.reason;
            }

            if (historyText) {
                historyText.innerText = gameHistory.length > 0 ? gameHistory.join(' - ') : "尚無紀錄";
            }

            const bigRoad = parseBigRoad(gameHistory);
            if (bigRoadView) {
                bigRoadView.innerText = bigRoad.length > 0 ? JSON.stringify(bigRoad) : "等待數據輸入...";
            }

            if (lowerRoadView) {
                const eb = analyzeLowerRoad(bigRoad, 1);
                const sm = analyzeLowerRoad(bigRoad, 2);
                const ck = analyzeLowerRoad(bigRoad, 3);
                lowerRoadView.innerText = `大眼仔: ${eb || '-'} | 小路: ${sm || '-'} | 曱甴路: ${ck || '-'}`;
            }
        }

        // 初始化執行
        updateDisplay();
    </script>
</body>
</html>
