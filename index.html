<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicProAi - 百家樂九宮格預測系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold mb-2">LogicProAi 百家樂九宮格預測系統</h1>
            <p class="text-gray-400">九宮格核心運算與觀望機制優化版</p>
        </header>

        <!-- 輸入區域 -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-xl font-semibold mb-4">輸入路單歷史 (例如: B, P, T, B, P...)</h2>
            <div class="flex gap-4 mb-4">
                <input type="text" id="historyInput" placeholder="請輸入字母，如 B,P,T,B,P" class="flex-1 bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                <button onclick="runAnalysis()" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded font-semibold transition">開始分析</button>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="addResult('B')" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-bold">莊 (B)</button>
                <button onclick="addResult('P')" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-bold">閒 (P)</button>
                <button onclick="addResult('T')" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-bold">和 (T)</button>
                <button onclick="clearHistory()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded">清除</button>
            </div>
        </div>

        <!-- 結果顯示區域 -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-4">分析結果</h2>
            <div id="resultOutput" class="space-y-4">
                <p class="text-gray-400">請輸入或點選路單資料以開始分析...</p>
            </div>
        </div>
    </div>

    <script>
        let pureHistory = [];

        function addResult(result) {
            pureHistory.push(result);
            document.getElementById('historyInput').value = pureHistory.join(', ');
            runAnalysis();
        }

        function clearHistory() {
            pureHistory = [];
            document.getElementById('historyInput').value = '';
            document.getElementById('resultOutput').innerHTML = '<p class="text-gray-400">已清除歷史資料</p>';
        }

        function runAnalysis() {
            const inputVal = document.getElementById('historyInput').value;
            if (inputVal.trim() !== '') {
                pureHistory = inputVal.split(',').map(s => s.trim().toUpperCase()).filter(s => s);
            }

            const analysis = analyzeNineGridBeadRoad(pureHistory);
            
            let outputHtml = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-700 p-4 rounded">
                    <div><strong>分析狀態：</strong> <span class="${analysis.target === 'NEUTRAL' ? 'text-yellow-400 font-bold' : 'text-green-400 font-bold'}">${analysis.status}</span></div>
                    <div><strong>推薦結果：</strong> <span class="text-xl font-bold">${analysis.target}</span></div>
                    <div><strong>信心指數：</strong> ${analysis.confidence}%</div>
                    <div class="md:col-span-2"><strong>詳細原因：</strong> ${analysis.reason}</div>
                </div>
            `;
            document.getElementById('resultOutput').innerHTML = outputHtml;
        }

        // ==========================================
        // 修正後的九宮格核心邏輯
        // ==========================================
        function analyzeNineGridBeadRoad(pureHistory) {
            if (pureHistory.length < 8) {
                return { 
                    name: '盤路路九宮格 (全局輔助)', 
                    target: 'NEUTRAL', 
                    confidence: 50, 
                    status: '觀望',
                    reason: '歷史筆數不足 8 筆，進行觀望' 
                };
            }

            // 1. 將一維歷史轉換為九宮格矩陣 (每列最多 6 筆)
            let grid = [];
            let currentCol = [];
            for (let i = 0; i < pureHistory.length; i++) {
                currentCol.push(pureHistory[i]);
                if (currentCol.length === 6 || i === pureHistory.length - 1) {
                    grid.push([...currentCol]);
                    currentCol = [];
                }
            }

            // 取得當前最新落點所在的行與列索引
            const lastColIndex = grid.length - 1;
            const lastRowIndex = grid[lastColIndex].length - 1;

            // 規則 2：Row 1 和 Row 2 不分析進行觀望 (Index 0 代表 Row 1，Index 1 代表 Row 2)
            if (lastRowIndex <= 1) {
                return {
                    name: '盤路路九宮格 (全局輔助)',
                    target: 'NEUTRAL',
                    confidence: 50,
                    status: '觀望',
                    reason: `目前落點位於 Row ${lastRowIndex + 1}，根據規則：Row 1 與 Row 2 進行觀望`
                };
            }

            // 尋找最佳 3x3 視窗
            let bestWindow = null;
            let maxCount = -1;

            for (let c = 0; c <= grid.length - 3; c++) {
                for (let r = 0; r <= 3; r++) {
                    let filledCount = 0;
                    for (let dc = 0; dc < 3; dc++) {
                        for (let dr = 0; dr < 3; dr++) {
                            if (grid[c + dc] && grid[c + dc][r + dr]) {
                                filledCount++;
                            }
                        }
                    }
                    if (filledCount > maxCount) {
                        maxCount = filledCount;
                        bestWindow = { c, r };
                    }
                }
            }

            if (!bestWindow) {
                return {
                    name: '盤路路九宮格 (全局輔助)',
                    target: 'NEUTRAL',
                    confidence: 50,
                    status: '觀望',
                    reason: '無法構成有效 3x3 視窗'
                };
            }

            // 3x3 視窗內數據統計
            let bankerCount = 0;
            let playerCount = 0;
            let tieCount = 0;

            for (let dc = 0; dc < 3; dc++) {
                for (let dr = 0; dr < 3; dr++) {
                    const val = grid[bestWindow.c + dc] ? grid[bestWindow.c + dc][bestWindow.r + dr] : null;
                    if (val === 'B' || val === '莊') bankerCount++;
                    else if (val === 'P' || val === '閒') playerCount++;
                    else if (val === 'T' || val === '和') tieCount++; // 規則 1：和局納入 3x3 計算
                }
            }

            // 規則 1 比例計算：分母只計算莊與閒，排除和局
            const totalBP = bankerCount + playerCount;
            let bankerRatio = 50;
            let playerRatio = 50;

            if (totalBP > 0) {
                bankerRatio = (bankerCount / totalBP) * 100;
                playerRatio = (playerCount / totalBP) * 100;
            }

            // 決定預測目標
            let target = 'B';
            let confidence = Math.round(bankerRatio);
            if (playerRatio > bankerRatio) {
                target = 'P';
                confidence = Math.round(playerRatio);
            } else if (bankerRatio === playerRatio) {
                target = 'NEUTRAL';
                confidence = 50;
            }

            return {
                name: '盤路路九宮格 (全局輔助)',
                target: target,
                confidence: confidence,
                status: '分析中',
                reason: `3x3 視窗統計 (含和局 ${tieCount} 筆) -> 莊: ${bankerCount}, 閒: ${playerCount} | 莊閒比例 => 莊: ${bankerRatio.toFixed(1)}%, 閒: ${playerRatio.toFixed(1)}%`
            };
        }
    </script>
</body>
</html>
