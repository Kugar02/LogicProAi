<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百家樂多維單分析與旗艦預測系統 (孫子兵法旗艦版)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2f;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --banker-color: #dc2626;
            --player-color: #2563eb;
            --tie-color: #16a34a;
            --border-color: #1e293b;
            --accent-color: #8b5cf6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 10px;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        /* 預測看板樣式 */
        .prediction-box {
            text-align: center;
            padding: 20px 0;
        }
        .prediction-signal {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        .prediction-reason {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        /* 控制按鈕樣式 */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-banker { background-color: var(--banker-color); }
        .btn-player { background-color: var(--player-color); }
        .btn-tie { background-color: var(--tie-color); }
        
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .action-row .btn {
            flex: 1;
            background-color: #334155;
        }
        /* 路單與歷史紀錄區塊 */
        .roadmaps {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .road-container {
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .road-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .history-list {
            font-size: 0.85rem;
            color: var(--text-muted);
            max-height: 80px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>百家樂多維單分析與旗艦預測系統</h1>
            <p>孫子兵法旗艦版 - 3x3 矩陣共振與反打核心系統</p>
        </header>

        <div class="dashboard">
            <!-- 左側操作與預測區 -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="card">
                    <h2>孫子兵法即時預測訊號</h2>
                    <div class="prediction-box">
                        <div class="prediction-signal" id="prediction-signal">觀望</div>
                        <div class="prediction-reason" id="prediction-reason">局數不足，暫無邏輯</div>
                    </div>
                </div>

                <div class="card">
                    <h2>控制台 (輸入開牌結果)</h2>
                    <div class="controls">
                        <button class="btn btn-banker" onclick="addResult('B')">莊 (B)</button>
                        <button class="btn btn-player" onclick="addResult('P')">閒 (P)</button>
                        <button class="btn btn-tie" onclick="addResult('T')">和 (T)</button>
                    </div>
                    <div class="action-row">
                        <button class="btn" onclick="undoResult()">悔棋</button>
                        <button class="btn" onclick="resetGame()" style="background-color: #7f1d1d;">重置</button>
                    </div>
                </div>

                <div class="card">
                    <h2>歷史局勢紀錄</h2>
                    <div class="history-list" id="history-list-text">尚無紀錄</div>
                </div>
            </div>

            <!-- 右側多維路單與分析區 -->
            <div class="card roadmaps">
                <h2>多維路單與狀態檢視</h2>
                
                <div class="road-container">
                    <div class="road-title" style="color: var(--accent-color); font-weight: bold;">【孫子兵法核心分析】(3x3 矩陣動態狀態)</div>
                    <div id="sun-tzu-view" style="font-size: 0.9rem; color: var(--text-muted); padding: 5px 0;">等待數據輸入...</div>
                </div>

                <div class="road-container">
                    <div class="road-title">大路結構摘要</div>
                    <div id="big-road-view" style="font-size: 0.9rem; color: var(--text-muted); padding: 5px 0;">等待數據輸入...</div>
                </div>

                <div class="road-container">
                    <div class="road-title">下三路動態指標 (大眼仔路 / 小路 / 曱甴路)</div>
                    <div id="lower-road-view" style="font-size: 0.9rem; color: var(--text-muted); padding: 5px 0;">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 紀錄歷史局勢數據 ('B', 'P', 'T') - 支援 localStorage 持久化
        let gameHistory = JSON.parse(localStorage.getItem('baccarat_sun_tzu_history')) || [];

        function saveHistory() {
            localStorage.setItem('baccarat_sun_tzu_history', JSON.stringify(gameHistory));
        }

        function addResult(result) {
            gameHistory.push(result);
            saveHistory();
            updateDisplay();
        }

        function undoResult() {
            if (gameHistory.length > 0) {
                gameHistory.pop();
                saveHistory();
                updateDisplay();
            }
        }

        function resetGame() {
            if (confirm("確定要重置所有紀錄嗎？")) {
                gameHistory = [];
                localStorage.removeItem('baccarat_sun_tzu_history');
                updateDisplay();
            }
        }

        // 核心：解析大路矩陣
        function parseBigRoad(history) {
            let bigRoad = [];
            let currentCol = [];
            let lastResult = '';
            
            history.forEach((result) => {
                if (result === 'T') {
                    if (bigRoad.length > 0) {
                        let lastCol = bigRoad[bigRoad.length - 1];
                        let lastItem = lastCol[lastCol.length - 1];
                        if (lastItem) lastItem.ties = (lastItem.ties || 0) + 1;
                    }
                    return;
                }

                if (result === lastResult || lastResult === '') {
                    currentCol.push(result);
                } else {
                    if (currentCol.length > 0) {
                        bigRoad.push(currentCol);
                    }
                    currentCol = [result];
                }
                lastResult = result;
            });
            if (currentCol.length > 0) {
                bigRoad.push(currentCol);
            }
            return bigRoad;
        }

        // 核心：下三路分析輔助函數
        function analyzeLowerRoad(bigRoad, offset) {
            if (bigRoad.length < offset + 1) return null;
            let hasPattern = checkRoadPattern(bigRoad, offset);
            if (!hasPattern) return null;
            return hasPattern; 
        }

        function checkRoadPattern(bigRoad, offset) {
            let colCount = bigRoad.length;
            if (colCount <= offset) return null;

            let currentLen = bigRoad[colCount - 1].length;
            let compareLen = bigRoad[colCount - 1 - offset].length;

            if (currentLen === compareLen) {
                return bigRoad[colCount - 1][0]; 
            } else if (Math.abs(currentLen - compareLen) === 1) {
                return null; 
            }

            return null; 
        }

        // 新增核心邏輯：孫子兵法 (盤珠路 3x3 矩陣框選分析)
        function calculateSunTzuPrediction(history) {
            // 起始要求：至少 14 局已開數據 (第 15 局為預測起點)
            if (history.length < 14) {
                return { signal: "觀望", reason: "局數不足 14 局 (需由第 3 行第 3 列起點開始)" };
            }

            // 計算下一個預測點在盤珠路中的位置 (6行一列)
            const targetCol = Math.floor(history.length / 6) + 1;
            const targetRow = (history.length % 6) + 1;

            // Row 1 與 Row 2 不作分析進行觀望，最高分析到 Row 6
            if (targetRow < 3 || targetRow > 6 || targetCol < 3) {
                return { signal: "觀望", reason: `目前在第 ${targetCol} 行第 ${targetRow} 行，未達 Row 3-6 分析區間` };
            }

            // 建立盤珠路 6 行網格數據結構
            let cols = [];
            let currentCol = [];
            history.forEach(res => {
                currentCol.push(res);
                if (currentCol.length === 6) {
                    cols.push(currentCol);
                    currentCol = [];
                }
            });
            if (currentCol.length > 0) cols.push(currentCol);

            function getBead(r, c) {
                let colIdx = c - 1;
                let rowIdx = r - 1;
                if (cols[colIdx] && cols[colIdx][rowIdx]) {
                    return cols[colIdx][rowIdx];
                }
                return null;
            }

            // 3x3 矩陣範圍 (以 targetRow, targetCol 為右下角)
            let startRow = targetRow - 2;
            let endRow = targetRow;
            let startCol = targetCol - 2;
            let endCol = targetCol;

            let countB = 0;
            let countP = 0;
            let filledCount = 0;

            for (let c = startCol; c <= endCol; c++) {
                for (let r = startRow; r <= endRow; r++) {
                    // 略過目標預測格本身
                    if (r === targetRow && c === targetCol) continue;
                    
                    let val = getBead(r, c);
                    if (val === 'B') {
                        countB++;
                        filledCount++;
                    } else if (val === 'P') {
                        countP++;
                        filledCount++;
                    } else if (val === 'T') {
                        filledCount++; // 和局計入 8 格內，但不計入莊閒比
                    }
                }
            }

            if (filledCount < 8) {
                return { signal: "觀望", reason: "3x3 矩陣內數據未滿 8 顆" };
            }

            let diff = Math.abs(countB - countP);
            // 9格內 8 顆莊閒比例差距超過 2 顆才成為比例
            if (diff <= 2) {
                return { signal: "觀望", reason: `3x3 矩陣莊閒差距 ${diff} 局 (未超過 2 局)` };
            }

            // 判定 3x3 比例較多與較少
            let dominant = countB > countP ? 'B' : 'P';
            let minority = countB > countP ? 'P' : 'B';

            // 全局莊閒統計
            let globalB = history.filter(x => x === 'B').length;
            let globalP = history.filter(x => x === 'P').length;
            let globalDiff = Math.abs(globalB - globalP);

            let baseRecommendation = '';
            let strategyDesc = '';

            // 全局已開出莊閒比例差距較少 (正負 2 局內) -> 推薦「比例」較少
            if (globalDiff <= 2) {
                baseRecommendation = minority;
                strategyDesc = `全局差距 ${globalDiff} 局 (<=2)，取較少者`;
            } else {
                // 全局已開出莊閒比例差距較多 (超過正負 2 局) -> 推薦「比例」較多
                baseRecommendation = dominant;
                strategyDesc = `全局差距 ${globalDiff} 局 (>2)，取較多者`;
            }

            let finalSignal = baseRecommendation;
            let rowNote = '';

            // Row 6 如出現比例，則進行反打操作
            if (targetRow === 6) {
                finalSignal = baseRecommendation === 'B' ? 'P' : 'B';
                rowNote = ' [Row 6 反打操作]';
            }

            let signalText = finalSignal === 'B' ? '莊 (Banker)' : '閒 (Player)';
            let reasonText = `孫子兵法 (Row ${targetRow}, Col ${targetCol}): 3x3(莊${countB}:閒${countP}), ${strategyDesc}${rowNote}`;

            return {
                signal: signalText,
                reason: reasonText,
                details: { targetRow, targetCol, countB, countP, globalDiff, rowNote }
            };
        }

        // 更新介面顯示
        function updateDisplay() {
            const prediction = calculateSunTzuPrediction(gameHistory);
            
            const signalElement = document.getElementById("prediction-signal");
            const reasonElement = document.getElementById("prediction-reason");
            const historyText = document.getElementById("history-list-text");
            const bigRoadView = document.getElementById("big-road-view");
            const lowerRoadView = document.getElementById("lower-road-view");
            const sunTzuView = document.getElementById("sun-tzu-view");
            
            if (signalElement) {
                signalElement.innerText = prediction.signal;
                if (prediction.signal === "觀望") {
                    signalElement.style.color = "var(--text-muted)";
                } else {
                    signalElement.style.color = prediction.signal.includes("莊") ? "var(--banker-color)" : "var(--player-color)";
                }
            }
            
            if (reasonElement) {
                reasonElement.innerText = prediction.reason;
            }

            if (historyText) {
                historyText.innerText = gameHistory.length > 0 ? gameHistory.join(' - ') : "尚無紀錄";
            }

            // 孫子兵法狀態檢視
            if (sunTzuView) {
                if (prediction.details) {
                    sunTzuView.innerText = `目前位置: Row ${prediction.details.targetRow}, Col ${prediction.details.targetCol} | 3x3莊閒分佈: 莊(${prediction.details.countB}) 閒(${prediction.details.countP}) | 全局差: ${prediction.details.globalDiff}${prediction.details.rowNote}`;
                } else {
                    sunTzuView.innerText = prediction.reason;
                }
            }

            // 大路檢視
            const bigRoad = parseBigRoad(gameHistory);
            if (bigRoadView) {
                bigRoadView.innerText = bigRoad.length > 0 ? JSON.stringify(bigRoad) : "等待數據輸入...";
            }

            // 下三路檢視
            if (lowerRoadView) {
                const eb = analyzeLowerRoad(bigRoad, 1);
                const sm = analyzeLowerRoad(bigRoad, 2);
                const ck = analyzeLowerRoad(bigRoad, 3);
                lowerRoadView.innerText = `大眼仔: ${eb || '-'} | 小路: ${sm || '-'} | 曱甴路: ${ck || '-'}`;
            }
        }

        // 初始化執行
        updateDisplay();
    </script>
</body>
</html>
